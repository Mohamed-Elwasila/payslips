services:
  db:
    image: postgres:16-alpine
    container_name: payslips-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payslips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payslips_dev}
      POSTGRES_DB: ${POSTGRES_DB:-payslips}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
