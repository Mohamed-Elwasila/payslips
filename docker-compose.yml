services:
  db:
    image: postgres:16-alpine
    container_name: payslips-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payslips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payslips_dev}
      POSTGRES_DB: ${POSTGRES_DB:-payslips}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  app:
    build: .
    container_name: payslips-app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payslips}:${POSTGRES_PASSWORD:-payslips_dev}@db:5432/${POSTGRES_DB:-payslips}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - db

volumes:
  pgdata:
